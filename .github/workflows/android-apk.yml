name: Build Android app

# Builds an installable debug APK in the cloud, so Android Studio is not needed.
# It runs when the Android files change, and by hand: Actions tab, Build Android app, Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # what the Capacitor 8 Android project needs
      - run: npm ci
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: student-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
